name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    name: Python Server Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Server Protocol & Unit Tests
        run: |
          python server/test_server.py

  flutter-tests:
    name: Flutter Client Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Client Dependencies
        run: |
          cd client
          flutter pub get

      - name: Analyze Flutter Code
        run: |
          cd client
          flutter analyze

      - name: Run Flutter Tests
        run: |
          cd client
          flutter test
